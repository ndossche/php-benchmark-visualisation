name: Generate visualisation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout PHP source code
      uses: actions/checkout@v4
      with:
        repository: php/php-src
        path: php-src
        fetch-depth: 0

    - name: Checkout benchmark data
      uses: actions/checkout@v4
      with:
        repository: php/benchmarking-data
        ref: main
        path: benchmarking-data

    - name: Checkout real-time benchmark data
      uses: actions/checkout@v4
      with:
        repository: php/real-time-benchmark-data
        ref: main
        path: real-time-benchmark-data

    - name: Generate benchmark data
      run: php ./generate_json.php

    - name: Deploy to Github Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output
