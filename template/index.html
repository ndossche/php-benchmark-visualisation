<!doctype html>
<html>
    <head>
        <title>Performance graphs</title>
        <meta charset="utf-8">
        <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
        <script>
            function getSelectedBranch() {
                const s = new URLSearchParams(location.search);
                return s.get("branch") ?? "master";
            }

            function setupBranchSelector(selectedBranch, branches) {
                const branchSelector = document.getElementById("branch-select");
                for (const branch of branches) {
                    const option = document.createElement("option");
                    option.value = branch;
                    option.innerText = branch;
                    option.selected = branch === selectedBranch;
                    branchSelector.appendChild(option);
                }
                branchSelector.onchange = () => {
                    const s = new URLSearchParams(location.search);
                    s.set("branch", branchSelector.value);
                    location.search = s.toString();
                };
            }

            function toggleDataSeries(e) {
                if (typeof(e.dataSeries.visible) === "undefined" || e.dataSeries.visible) {
                    e.dataSeries.visible = false;
                } else{
                    e.dataSeries.visible = true;
                }
                e.chart.render();
            }

            window.onload = async _ => {
                const rawData = await fetch('data.json').then(r => r.json());

                const branches = Object.keys(rawData);
                branches.pop(); // Remove "benchmarks" key

                let selectedBranch = getSelectedBranch();
                if (branches.indexOf(selectedBranch) === -1) {
                    alert("Invalid branch selection");
                    selectedBranch = "master";
                }

                const branchData = rawData[selectedBranch];

                setupBranchSelector(selectedBranch, branches);

                const data = [];

                for (const benchmark of rawData.benchmarks) {
                    data.push({
                        type: "line",
                        dataPoints: [],
                        name: benchmark,
                        showInLegend: true,
                        markerSize: 0,
                        click: function (e) {
                            const url = "https://github.com/php/php-src/commit/" + e.dataPoint.commit_info.id;
                            window.open(url, "_blank");
                        },
                    });
                }

                // Reformat date
                for (const entry of branchData) {
                    const str = entry.commit_info.date.date.replace(' ', 'T') + entry.commit_info.date.timezone;
                    entry.commit_info.date = new Date(str);
                }

                // Sort by date
                branchData.sort((a, b) => {
                    return a.commit_info.date - b.commit_info.date;
                });

                for (const entry of branchData) {
                    const date = entry.commit_info.date;
                    Object.values(rawData.benchmarks).forEach((name, id) => {
                        if (entry.summary[name])
                            data[id].dataPoints.push({ x: date, y: Number(entry.summary[name].instructions), commit_info: entry.commit_info });
                    });
                }

                for (let i = 0; i < data.length; ++i) {
                    const dataPoints = data[i].dataPoints;
                    let firstNonNull = 0;
                    while (firstNonNull < dataPoints.length && !dataPoints[firstNonNull].y)
                        firstNonNull++;
                    let first = dataPoints[firstNonNull].y;
                    for (let j = firstNonNull + 1; j < dataPoints.length; ++j) {
                        if (dataPoints[j].y)
                            dataPoints[j].y = (dataPoints[j].y - first) / first * 100;
                    }
                    dataPoints[firstNonNull].y = 0;
                }

                const config = {
                    data: data,
                    legend: {
                        verticalAlign: "top",
                        itemclick: toggleDataSeries,
                        fontSize: 14,
                    },
                    title: { text: 'PHP performance measurements in number of instructions', fontSize: 14 },
                    subtitles: [{ text: 'Smaller numbers are better', fontSize: 12 }],
                    axisX: {
                      titleFontSize: 14,
                      labelFontSize: 14,
                      gridThickness: 1,
                      gridColor: '#dddddd',
                      lineColor: '#dddddd',
                    },
                    axisY: {
                        title: 'Relative change in percentage in instruction count',
                        suffix: "%",
                        titleFontSize: 14,
                        labelFontSize: 14,
                        gridColor: '#dddddd',
                        lineColor: '#dddddd',
                    },
                    zoomEnabled: true,
                    toolTip: {
                        content: function(e) {
                            let label = e.entries[0].dataSeries.name;

                            const {commit_info} = branchData[e.entries[0].index];
                            let value = e.entries[0].dataPoint.y.toLocaleString(undefined, { maximumFractionDigits: 3 }) + "%";

                            return `
                                ${label}: ${value}<br>
                                Commit ID: ${commit_info.id.substr(0, 8)}<br>
                                ${commit_info.subject}
                            `;
                        },
                    },
                };

                const chart = new CanvasJS.Chart("chart-container", config);
                chart.render();
            };
        </script>
        <style>
            body, html {
                margin: 0;
                padding: 0;
            }
            .container {
                margin-top: 16px;
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .chart-container {
                width: 90%;
                height: 800px;
            }
            .button-container {
                width: 90%;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
            }
            .button-container > * {
                margin: .5em;
            }
            .button-container > .links {
                font-size: 0.9rem;
            }
            .button-container > .links > a {
                margin: .5em;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="button-container">
                <div>
                    <span>Branch: </span>
                    <select id="branch-select"></select>
                </div>
                <div class="links">
                    <a href="https://github.com/php/benchmarking-data" rel="noopener" target="_blank">Benchmark data repo</a>
                    <a href="https://github.com/nielsdos/php-benchmark-visualisation" rel="noopener" target="_blank">Visualisation repo</a>
                </div>
            </div>
            <div id="chart-container" class="chart-container"></div>
        </div>
    </body>
</html>
